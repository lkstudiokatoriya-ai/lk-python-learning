<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0b1020">
    <title>Mobile Python Compiler</title>

    <!-- PWA Manifest (Assuming it exists in the project as requested) -->
    <link rel="manifest" href="manifest.json">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Google Fonts: Inter for UI, JetBrains Mono for Code -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- CodeMirror Core and Theme for Editor -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/theme/material-darker.min.css">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    },
                    colors: {
                        compiler: {
                            bg: '#0b1020',
                            panel: '#111827',
                            editorBg: '#1a202c', /* Slightly lighter for contrast */
                            terminalBg: '#05080f',
                            accent: '#3776AB',
                            accentHover: '#2a5d8c',
                            yellow: '#FFD43B',
                            error: '#ef4444',
                            success: '#10b981'
                        }
                    }
                }
            }
        }
    </script>

    <style>
        /* Base Full-Screen Setup */
        :root {
            --sat: env(safe-area-inset-top);
            --sab: env(safe-area-inset-bottom);
            --sar: env(safe-area-inset-right);
            --sal: env(safe-area-inset-left);
        }

        html, body {
            height: 100dvh;
            width: 100vw;
            margin: 0;
            padding: 0;
            background-color: #0b1020;
            color: #f8fafc;
            overflow: hidden; /* Prevent body scroll, handle scroll in panels */
            display: flex;
            flex-direction: column;
            -webkit-tap-highlight-color: transparent;
        }

        /* Application Container */
        #app-container {
            display: flex;
            flex-direction: column;
            height: 100%;
            width: 100%;
            padding-top: var(--sat);
            padding-bottom: var(--sab);
            padding-left: var(--sal);
            padding-right: var(--sar);
        }

        /* Header Styling */
        header {
            flex-shrink: 0;
            background: rgba(17, 24, 39, 0.8);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            z-index: 10;
        }

        /* Editor Section */
        #editor-container {
            flex: 1 1 50%;
            display: flex;
            flex-direction: column;
            min-height: 0; /* Important for flex child scrolling */
            position: relative;
            background-color: #1a202c;
        }

        /* CodeMirror Customization for Mobile */
        .CodeMirror {
            height: 100% !important;
            font-family: 'JetBrains Mono', monospace !important;
            font-size: 14px;
            background-color: transparent !important; /* Let container background show */
        }
        
        .CodeMirror-gutters {
            background-color: #1a202c !important;
            border-right: 1px solid rgba(255,255,255,0.05) !important;
        }
        
        .CodeMirror-linenumber {
            color: #64748b !important;
        }

        /* Controls Section */
        #controls-container {
            flex-shrink: 0;
            background-color: #111827;
            border-top: 1px solid rgba(255,255,255,0.05);
            border-bottom: 1px solid rgba(255,255,255,0.05);
            padding: 10px;
            display: flex;
            gap: 10px;
            z-index: 10;
            box-shadow: 0 -4px 10px rgba(0,0,0,0.2);
        }

        /* Terminal Section */
        #terminal-container {
            flex: 1 1 40%;
            background-color: #05080f;
            display: flex;
            flex-direction: column;
            min-height: 0; /* Important for flex child scrolling */
        }

        .terminal-header {
            flex-shrink: 0;
            padding: 8px 12px;
            background-color: #0f172a;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            font-size: 11px;
            font-weight: 600;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        #terminal-output {
            flex: 1;
            overflow-y: auto;
            padding: 12px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 13px;
            line-height: 1.5;
            color: #e2e8f0;
            white-space: pre-wrap;
            word-wrap: break-word;
            scroll-behavior: smooth;
        }

        /* Scrollbar Styling for Terminal */
        #terminal-output::-webkit-scrollbar {
            width: 4px;
        }
        #terminal-output::-webkit-scrollbar-track {
            background: transparent;
        }
        #terminal-output::-webkit-scrollbar-thumb {
            background: rgba(100, 116, 139, 0.5);
            border-radius: 4px;
        }

        /* Terminal specific text colors */
        .term-prompt { color: #10b981; }
        .term-error { color: #ef4444; }
        .term-info { color: #3b82f6; }
        .term-warning { color: #f59e0b; }

        /* Custom Input Prompt Modal */
        #input-modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(4px);
            z-index: 50;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        #input-modal.active {
            display: flex;
            animation: fadeIn 0.2s ease-out;
        }

        /* Toast Notification */
        #toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: rgba(17, 24, 39, 0.9);
            color: white;
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 500;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 100;
            border: 1px solid rgba(255,255,255,0.1);
            backdrop-filter: blur(8px);
        }

        #toast.show {
            transform: translateX(-50%) translateY(0);
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        
        /* Utility for buttons */
        .btn-press {
            transition: transform 0.1s;
        }
        .btn-press:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>

    <div id="app-container">
        
        <!-- Header -->
        <header class="flex items-center justify-between px-4 py-3">
            <div class="flex items-center gap-3">
                <a href="index.html" class="w-8 h-8 flex items-center justify-center rounded-full bg-slate-800 border border-slate-700 text-slate-400 hover:text-white transition-colors active:scale-95">
                    <i class="fas fa-chevron-left text-sm"></i>
                </a>
                <div class="flex flex-col">
                    <div class="flex items-center gap-2">
                        <i class="fab fa-python text-compiler-yellow text-lg"></i>
                        <h1 class="text-white font-bold text-base leading-none">Python Live</h1>
                    </div>
                </div>
            </div>
            
            <!-- Status Indicator -->
            <div class="flex items-center gap-2 px-3 py-1.5 rounded-full bg-slate-800/50 border border-slate-700">
                <div id="status-dot" class="w-2 h-2 rounded-full bg-amber-400 animate-pulse"></div>
                <span id="status-text" class="text-xs font-medium text-slate-300">Loading Env...</span>
            </div>
        </header>

        <!-- Editor Section -->
        <div id="editor-container">
            <!-- CodeMirror will inject here -->
            <textarea id="code-editor">
# Welcome to Python Live Compiler (Mobile)
# Write your code below

def greet(name):
    print(f"Hello, {name}! 🐍")
    print("Welcome to the mobile coding environment.")

# Testing the function
greet("Developer")

# You can also try simple math
a = 10
b = 20
print(f"\nCalculation: {a} + {b} = {a + b}")
</textarea>
        </div>

        <!-- Controls Section -->
        <div id="controls-container">
            <button id="btn-run" class="btn-press flex-1 bg-compiler-accent text-white font-semibold py-3 rounded-xl shadow-lg flex items-center justify-center gap-2 relative overflow-hidden">
                <i class="fas fa-play"></i> Run Code
            </button>
            <button id="btn-clear" class="btn-press px-5 bg-slate-800 border border-slate-700 text-slate-300 font-medium rounded-xl flex items-center justify-center gap-2 active:bg-slate-700">
                <i class="fas fa-eraser"></i> Clear
            </button>
            <button id="btn-copy" class="btn-press px-5 bg-slate-800 border border-slate-700 text-slate-300 font-medium rounded-xl flex items-center justify-center gap-2 active:bg-slate-700">
                <i class="fas fa-copy"></i> Copy
            </button>
        </div>

        <!-- Terminal Section -->
        <div id="terminal-container">
            <div class="terminal-header">
                <span class="flex items-center gap-2"><i class="fas fa-terminal"></i> Terminal Output</span>
            </div>
            <div id="terminal-output">
<span class="term-info">System initialized. Waiting for Python runtime...</span>
</div>
        </div>

    </div>

    <!-- Custom Input Modal -->
    <div id="input-modal">
        <div class="bg-slate-800 border border-slate-600 rounded-2xl w-full max-w-sm p-6 shadow-2xl flex flex-col gap-4">
            <div class="flex items-center gap-3 text-white font-semibold">
                <i class="fas fa-keyboard text-compiler-accent"></i>
                <span>Input Required</span>
            </div>
            <p id="input-prompt-text" class="text-slate-300 text-sm">Please enter value:</p>
            <input type="text" id="custom-input-field" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-compiler-accent transition-colors" autocomplete="off" autocorrect="off" autocapitalize="off">
            <div class="flex justify-end mt-2">
                <button id="btn-submit-input" class="bg-compiler-accent hover:bg-compiler-accentHover text-white px-6 py-2.5 rounded-xl font-medium transition-colors active:scale-95">
                    Submit
                </button>
            </div>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast"><i class="fas fa-check-circle text-compiler-success mr-2"></i> <span id="toast-msg">Action successful</span></div>

    <!-- Libraries -->
    <!-- CodeMirror JS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/python/python.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/addon/edit/closebrackets.min.js"></script>
    
    <!-- Pyodide -->
    <script src="https://cdn.jsdelivr.net/pyodide/v0.25.0/full/pyodide.js"></script>

    <script>
        // DOM Elements
        const terminalOutput = document.getElementById('terminal-output');
        const btnRun = document.getElementById('btn-run');
        const btnClear = document.getElementById('btn-clear');
        const btnCopy = document.getElementById('btn-copy');
        const statusDot = document.getElementById('status-dot');
        const statusText = document.getElementById('status-text');
        const toastEl = document.getElementById('toast');
        const toastMsg = document.getElementById('toast-msg');
        
        // Input Modal Elements
        const inputModal = document.getElementById('input-modal');
        const inputField = document.getElementById('custom-input-field');
        const inputPromptText = document.getElementById('input-prompt-text');
        const btnSubmitInput = document.getElementById('btn-submit-input');

        // State
        let pyodideInstance = null;
        let isExecuting = false;
        let inputResolve = null;

        // Initialize CodeMirror Editor
        const editor = CodeMirror.fromTextArea(document.getElementById('code-editor'), {
            mode: 'python',
            theme: 'material-darker',
            lineNumbers: true,
            indentUnit: 4,
            tabSize: 4,
            lineWrapping: true,
            autoCloseBrackets: true,
            viewportMargin: Infinity, // Important for flex layout scrolling on mobile
            extraKeys: {
                "Tab": function(cm) {
                    cm.replaceSelection("    ", "end");
                }
            }
        });

        // Ensure editor refreshes correctly when layout changes
        setTimeout(() => editor.refresh(), 100);
        window.addEventListener('resize', () => editor.refresh());

        // Utility: Show Toast
        function showToast(message) {
            toastMsg.textContent = message;
            toastEl.classList.add('show');
            setTimeout(() => {
                toastEl.classList.remove('show');
            }, 2500);
        }

        // Utility: Append to Terminal
        function appendTerminal(text, type = 'normal') {
            const span = document.createElement('span');
            
            // Handle basic HTML escaping to prevent injection but allow basic formatting
            let escapedText = text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
            
            if (type === 'prompt') {
                span.className = 'term-prompt';
                escapedText = `$ ${escapedText}\n`;
            } else if (type === 'error') {
                span.className = 'term-error';
            } else if (type === 'info') {
                span.className = 'term-info';
                escapedText = `${escapedText}\n`;
            } else if (type === 'warning') {
                span.className = 'term-warning';
            }
            
            span.innerHTML = escapedText;
            terminalOutput.appendChild(span);
            
            // Auto-scroll to bottom
            terminalOutput.scrollTop = terminalOutput.scrollHeight;
        }

        // Utility: Update Status UI
        function updateStatus(state) {
            statusDot.className = 'w-2 h-2 rounded-full'; // reset
            if (state === 'loading') {
                statusDot.classList.add('bg-amber-400', 'animate-pulse');
                statusText.textContent = 'Loading Env...';
                btnRun.disabled = true;
                btnRun.style.opacity = '0.5';
            } else if (state === 'ready') {
                statusDot.classList.add('bg-compiler-success');
                statusText.textContent = 'Ready';
                btnRun.disabled = false;
                btnRun.style.opacity = '1';
                btnRun.innerHTML = '<i class="fas fa-play"></i> Run Code';
            } else if (state === 'running') {
                statusDot.classList.add('bg-compiler-accent', 'animate-pulse');
                statusText.textContent = 'Executing...';
                btnRun.disabled = true;
                btnRun.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Running';
            } else if (state === 'error') {
                statusDot.classList.add('bg-compiler-error');
                statusText.textContent = 'Error';
                btnRun.disabled = false;
                btnRun.innerHTML = '<i class="fas fa-play"></i> Run Code';
            }
        }

        // Custom Input Handler for Python input()
        window.handlePythonInput = async function(promptText) {
            return new Promise((resolve) => {
                inputPromptText.textContent = promptText || "Enter input:";
                inputField.value = '';
                inputModal.classList.add('active');
                inputField.focus();
                
                // Store resolver to be called on submit
                inputResolve = resolve;
            });
        };

        // Submit input modal
        function submitInput() {
            if (inputResolve) {
                const val = inputField.value;
                inputModal.classList.remove('active');
                
                // Echo input to terminal
                appendTerminal(val + '\n', 'normal');
                
                inputResolve(val);
                inputResolve = null;
            }
        }

        btnSubmitInput.addEventListener('click', submitInput);
        inputField.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') submitInput();
        });

        // Initialize Pyodide
        async function initPython() {
            updateStatus('loading');
            try {
                pyodideInstance = await loadPyodide();
                
                // Set up standard output redirection to our terminal
                pyodideInstance.runPython(`
                    import sys
                    import js
                    
                    class TerminalWriter:
                        def write(self, text):
                            js.appendTerminal(text, "normal")
                        def flush(self):
                            pass
                            
                    sys.stdout = TerminalWriter()
                    sys.stderr = TerminalWriter()
                `);
                
                // Set up custom input handling
                pyodideInstance.runPython(`
                    import builtins
                    import js
                    
                    async def custom_input(prompt=""):
                        js.appendTerminal(prompt, "normal")
                        val = await js.handlePythonInput(prompt)
                        return val
                        
                    builtins.input = custom_input
                `);

                appendTerminal('Python Environment Ready. 🐍', 'info');
                updateStatus('ready');
            } catch (error) {
                console.error("Failed to load Pyodide:", error);
                appendTerminal('Failed to load Python environment. Please check connection and reload.', 'error');
                updateStatus('error');
            }
        }

        // Run Code Execution
        async function runCode() {
            if (isExecuting || !pyodideInstance) return;
            
            const code = editor.getValue();
            if (!code.trim()) {
                showToast("Code is empty");
                return;
            }

            isExecuting = true;
            updateStatus('running');
            appendTerminal('python main.py', 'prompt');
            
            try {
                // Determine if code contains input() requiring async execution
                const hasInput = code.includes('input(');
                
                if (hasInput) {
                    // Need to run via Pyodide's runPythonAsync to handle JS Promises
                    // We wrap the user code in an async function to allow await inside their code indirectly
                    await pyodideInstance.runPythonAsync(code);
                } else {
                    // Fast synchronous execution for standard code
                    pyodideInstance.runPython(code);
                }
                
                updateStatus('ready');
            } catch (error) {
                // Extract clean python error string
                let errorStr = error.toString();
                if (errorStr.includes("PythonError:")) {
                    errorStr = errorStr.split('PythonError:').pop().trim();
                }
                appendTerminal(`\n${errorStr}\n`, 'error');
                updateStatus('error');
                setTimeout(() => updateStatus('ready'), 2000);
            } finally {
                isExecuting = false;
            }
        }

        // Event Listeners for Controls
        btnRun.addEventListener('click', runCode);

        btnClear.addEventListener('click', () => {
            terminalOutput.innerHTML = '';
            showToast("Terminal cleared");
        });

        btnCopy.addEventListener('click', () => {
            const code = editor.getValue();
            navigator.clipboard.writeText(code).then(() => {
                showToast("Code copied to clipboard");
            }).catch(() => {
                showToast("Failed to copy");
            });
        });

        // Initialize on load
        window.addEventListener('DOMContentLoaded', () => {
            initPython();
        });

    </script>
</body>
</html>
