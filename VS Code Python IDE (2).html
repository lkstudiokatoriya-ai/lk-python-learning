<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VS Code Web - Python Live IDE (Desktop Edition)</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    
    <!-- FontAwesome (VS Code Icons Simulation) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- CodeMirror for the Editor -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/theme/darcula.min.css">

    <!-- Pyodide (Python Engine) -->
    <script src="https://cdn.jsdelivr.net/pyodide/v0.25.0/full/pyodide.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    },
                    colors: {
                        vsc: {
                            bg: '#1e1e1e',          
                            activity: '#181818',    
                            sidebar: '#252526',     
                            sidebarHover: '#2a2d2e',
                            sidebarActive: '#37373d',
                            tab: '#2d2d2d',         
                            tabInactive: '#1e1e1e', 
                            border: '#333333',
                            blue: '#007acc',        
                            blueHover: '#005f9e',
                            text: '#cccccc',        
                            muted: '#858585',       
                            terminal: '#1e1e1e',
                            error: '#f14c4c',
                            success: '#89d185',
                            warn: '#cca700'
                        }
                    }
                }
            }
        }
    </script>

    <style>
        /* STRICTLY DESKTOP STYLING */
        body, html {
            margin: 0; padding: 0;
            height: 100vh; width: 100vw;
            background-color: #1e1e1e;
            color: #cccccc;
            font-family: 'Inter', sans-serif;
            overflow: hidden;
            /* Force Desktop dimensions */
            min-width: 900px;
            min-height: 500px;
        }

        /* Resizers */
        .resizer-vertical {
            width: 4px; background-color: transparent;
            cursor: col-resize; z-index: 10;
            transition: background-color 0.2s;
        }
        .resizer-vertical:hover, .resizer-vertical:active { background-color: #007acc; }

        .resizer-horizontal {
            height: 4px; background-color: transparent;
            cursor: row-resize; z-index: 10;
            transition: background-color 0.2s;
        }
        .resizer-horizontal:hover, .resizer-horizontal:active { background-color: #007acc; }

        /* Scrollbars */
        ::-webkit-scrollbar { width: 12px; height: 12px; }
        ::-webkit-scrollbar-track { background: #1e1e1e; }
        ::-webkit-scrollbar-thumb { background: #424242; border: 3px solid #1e1e1e; border-radius: 6px; }
        ::-webkit-scrollbar-thumb:hover { background: #4f4f4f; }

        /* CodeMirror Overrides */
        .CodeMirror {
            height: 100% !important;
            font-family: 'JetBrains Mono', monospace !important;
            font-size: 14px;
            background-color: #1e1e1e !important;
        }
        .CodeMirror-gutters { background-color: #1e1e1e !important; border-right: none !important; }
        .CodeMirror-linenumber { color: #858585 !important; }
        .CodeMirror-cursor { border-left: 2px solid #aeafad !important; }

        /* File Explorer */
        .file-item { display: flex; align-items: center; padding: 4px 12px 4px 20px; cursor: pointer; user-select: none; font-size: 13px; }
        .file-item:hover { background-color: #2a2d2e; }
        .file-item.active { background-color: #37373d; color: #ffffff; }
        .file-item .fa-python { color: #3776AB; width: 20px; text-align: center; }

        /* Tabs */
        .editor-tab {
            display: flex; align-items: center; gap: 6px;
            padding: 8px 12px; cursor: pointer; font-size: 13px;
            background-color: #1e1e1e; color: #858585; border-right: 1px solid #252526;
            min-width: 120px; max-width: 200px;
        }
        .editor-tab.active { background-color: #1e1e1e; color: #ffffff; border-top: 1px solid #007acc; }
        .editor-tab:not(.active) { background-color: #2d2d2d; border-top: 1px solid transparent; }
        .editor-tab .close-btn { opacity: 0; padding: 2px 4px; border-radius: 4px; }
        .editor-tab:hover .close-btn { opacity: 1; }
        .editor-tab .close-btn:hover { background-color: #424242; }

        /* Terminal Formatting */
        #terminal-output { white-space: pre-wrap; word-wrap: break-word; outline: none; }
        .term-prompt { color: #89d185; font-weight: 500; }
        .term-input { background: transparent; border: none; color: #cccccc; outline: none; flex: 1; font-family: inherit; font-size: inherit; }
        .term-error { color: #f14c4c; }
        .term-sys { color: #cca700; }
    </style>
</head>
<body class="flex flex-col text-vsc-text">

    <!-- Titlebar -->
    <div class="h-9 bg-vsc-sidebar flex items-center justify-between px-4 select-none border-b border-vsc-border flex-shrink-0 z-20">
        <div class="flex items-center gap-3">
            <i class="fab fa-python text-vsc-blue text-lg"></i>
            <span class="text-xs text-vsc-muted font-semibold tracking-wide">VS Code - Desktop Edition</span>
        </div>
        <div class="flex items-center gap-4 text-xs">
            <button onclick="ide.toggleFullscreen()" class="hover:text-white px-3 py-1 bg-vsc-activity rounded flex items-center gap-2 border border-vsc-border transition-colors" title="Toggle Fullscreen">
                <i class="fas fa-expand"></i> Fullscreen
            </button>
            <button onclick="ide.runCode()" class="hover:bg-vsc-blue hover:text-white px-3 py-1 bg-vsc-activity rounded flex items-center gap-2 text-vsc-success border border-vsc-border transition-colors" title="Run Python Code">
                <i class="fas fa-play"></i> Run Code
            </button>
            <button onclick="ide.stopExecution()" id="btn-stop" class="hover:bg-vsc-error hover:text-white px-3 py-1 bg-vsc-activity rounded flex items-center gap-2 text-vsc-error border border-vsc-border disabled:opacity-50 transition-colors" disabled title="Stop Execution">
                <i class="fas fa-stop"></i> Stop
            </button>
        </div>
    </div>

    <!-- Main Workspace -->
    <div class="flex flex-1 overflow-hidden relative">
        
        <!-- Activity Bar (Far Left) -->
        <div class="w-12 bg-vsc-activity flex flex-col items-center py-3 flex-shrink-0 z-20 border-r border-vsc-border">
            <div class="flex flex-col gap-4 w-full">
                <button onclick="ide.toggleSidebar()" class="relative text-white group w-full flex justify-center border-l-2 border-vsc-blue" id="activity-explorer" title="Toggle Explorer">
                    <i class="far fa-copy text-2xl"></i>
                </button>
                <button class="text-vsc-muted hover:text-white group w-full flex justify-center border-l-2 border-transparent" title="Search">
                    <i class="fas fa-search text-xl"></i>
                </button>
            </div>
            <div class="mt-auto flex flex-col gap-4 w-full pb-2">
                <button class="text-vsc-muted hover:text-white w-full flex justify-center" title="Settings">
                    <i class="fas fa-cog text-xl"></i>
                </button>
            </div>
        </div>

        <!-- Sidebar: Explorer -->
        <div id="sidebar" class="w-64 bg-vsc-sidebar flex flex-col flex-shrink-0 transition-all duration-200 overflow-hidden border-r border-vsc-border">
            <div class="px-5 py-3 text-xs font-semibold text-vsc-muted flex justify-between items-center tracking-wide">
                <span>EXPLORER</span>
            </div>
            
            <!-- Folder Header -->
            <div class="flex items-center justify-between px-2 py-1 cursor-pointer hover:bg-vsc-sidebarHover font-bold text-xs group" id="folder-header">
                <div class="flex items-center gap-1">
                    <i class="fas fa-chevron-down text-[10px]"></i>
                    <span>WORKSPACE</span>
                </div>
                <div class="flex gap-2 text-vsc-muted opacity-0 group-hover:opacity-100 transition-opacity">
                    <button onclick="ide.newProject()" title="New Project (Clear all)" class="hover:text-white text-vsc-blue"><i class="fas fa-folder-plus"></i></button>
                    <button onclick="ide.createNewFile()" title="New File" class="hover:text-white"><i class="fas fa-file-medical"></i></button>
                    <button onclick="document.getElementById('file-upload').click()" title="Upload File" class="hover:text-white"><i class="fas fa-upload"></i></button>
                    <input type="file" id="file-upload" accept=".py" class="hidden" onchange="ide.handleFileUpload(event)">
                </div>
            </div>

            <!-- File List -->
            <div id="file-list" class="flex-1 overflow-y-auto pb-4 mt-1">
                <!-- Populated via JS -->
            </div>
        </div>

        <div class="resizer-vertical" id="resizer-sidebar"></div>

        <!-- Right Side: Editor & Terminal Panel -->
        <div class="flex-1 flex flex-col min-w-[300px] overflow-hidden bg-vsc-bg relative">
            
            <!-- Editor Area -->
            <div class="flex-1 flex flex-col min-h-[100px] relative">
                <div class="flex bg-vsc-sidebar overflow-x-auto h-9 flex-shrink-0" id="editor-tabs">
                    <!-- Populated via JS -->
                </div>
                
                <div class="h-6 bg-vsc-bg flex items-center px-4 text-[13px] text-vsc-muted border-b border-vsc-border select-none shadow-sm z-10">
                    <span>WORKSPACE</span> <i class="fas fa-chevron-right text-[10px] mx-2"></i> <span class="text-vsc-text" id="bc-filename">main.py</span>
                </div>
                
                <div class="flex-1 relative">
                    <textarea id="code-editor"></textarea>
                </div>
            </div>

            <div class="resizer-horizontal" id="resizer-terminal"></div>

            <!-- Terminal Area (Bottom Panel) -->
            <div id="bottom-panel" class="h-64 bg-vsc-terminal flex flex-col flex-shrink-0 border-t border-vsc-border">
                <div class="flex px-4 pt-2 gap-4 border-b border-vsc-border select-none">
                    <button class="text-xs uppercase text-white border-b border-vsc-blue pb-1 font-medium tracking-wide">Terminal</button>
                    <div class="ml-auto flex gap-3 text-vsc-muted pb-1">
                        <button onclick="ide.clearTerminal()" class="hover:text-white" title="Clear Terminal"><i class="fas fa-trash"></i></button>
                        <button onclick="ide.toggleTerminal()" class="hover:text-white" title="Toggle Terminal"><i class="fas fa-times"></i></button>
                    </div>
                </div>
                
                <div id="terminal-wrapper" class="flex-1 p-3 font-mono text-[13px] overflow-y-auto cursor-text relative" onclick="ide.focusTerminal()">
                    <div id="terminal-output" class="w-full"></div>
                    <div id="terminal-input-container" class="flex items-center gap-2 mt-1">
                        <span class="term-prompt">user@desktop:~$</span>
                        <input type="text" id="terminal-input" class="term-input" autocomplete="off" spellcheck="false">
                    </div>
                </div>
            </div>
        </div>

    </div>

    <!-- Status Bar (Bottom) -->
    <div class="h-6 bg-vsc-blue text-white flex items-center justify-between px-3 text-xs select-none flex-shrink-0 z-20">
        <div class="flex items-center gap-3">
            <button class="hover:bg-vsc-blueHover px-2 h-full flex items-center gap-1 rounded">
                <i class="fas fa-code-branch"></i> master
            </button>
            <div id="engine-status" class="flex items-center gap-2 px-2">
                <i class="fas fa-sync fa-spin"></i> Initializing Engine...
            </div>
        </div>
        
        <div class="flex items-center gap-3 text-white/90">
            <div id="cursor-position" class="hover:bg-vsc-blueHover px-2 h-full flex items-center cursor-pointer">Ln 1, Col 1</div>
            <div class="hover:bg-vsc-blueHover px-2 h-full flex items-center cursor-pointer font-bold">Python 3</div>
        </div>
    </div>

    <!-- CodeMirror JS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/python/python.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/addon/edit/closebrackets.min.js"></script>

    <script>
        const state = {
            files: {},
            activeFile: 'main.py',
            pyodide: null,
            isRunning: false,
            awaitingInput: null,
            sidebarVisible: true,
            terminalVisible: true
        };

        const defaultCode = `print("Hello World!")

# This program asks for your name and greets you
name = input("What is your name? ")
print(f"Welcome to VS Code Desktop IDE, {name}!")

# A simple loop test
for i in range(1, 6):
    print(f"Counting: {i}")
`;

        const els = {
            editor: document.getElementById('code-editor'),
            fileList: document.getElementById('file-list'),
            tabs: document.getElementById('editor-tabs'),
            termOutput: document.getElementById('terminal-output'),
            termInput: document.getElementById('terminal-input'),
            termInputCont: document.getElementById('terminal-input-container'),
            termWrapper: document.getElementById('terminal-wrapper'),
            cursorPos: document.getElementById('cursor-position'),
            btnStop: document.getElementById('btn-stop'),
            engineStatus: document.getElementById('engine-status'),
            bcFile: document.getElementById('bc-filename'),
            sidebar: document.getElementById('sidebar'),
            panel: document.getElementById('bottom-panel'),
            actExplorer: document.getElementById('activity-explorer')
        };

        const editor = CodeMirror.fromTextArea(els.editor, {
            mode: 'python',
            theme: 'darcula',
            lineNumbers: true,
            indentUnit: 4,
            tabSize: 4,
            lineWrapping: true,
            autoCloseBrackets: true,
            extraKeys: {
                "Ctrl-Enter": () => ide.runCode(),
                "Cmd-Enter": () => ide.runCode(),
                "Ctrl-S": () => ide.saveFile(),
                "Cmd-S": () => ide.saveFile(),
                "Tab": (cm) => cm.replaceSelection("    ", "end")
            }
        });

        editor.on('cursorActivity', () => {
            const pos = editor.getCursor();
            els.cursorPos.textContent = `Ln ${pos.line + 1}, Col ${pos.ch + 1}`;
        });

        editor.on('change', () => {
            if (state.activeFile && state.files[state.activeFile]) {
                const isModified = state.files[state.activeFile].content !== editor.getValue();
                state.files[state.activeFile].content = editor.getValue();
                
                if (isModified !== state.files[state.activeFile].modified) {
                    state.files[state.activeFile].modified = isModified;
                    ide.renderTabs();
                }
            }
        });

        const ide = {
            
            newProject: () => {
                if (confirm("Create a new project? This will clear ALL files in the workspace!")) {
                    state.files = { 'main.py': { content: 'print("Hello, New Project!")\n', modified: false } };
                    ide.switchFile('main.py');
                    ide.saveFile();
                    ide.clearTerminal();
                    ide.printToTerminal("Started a new workspace project.\n", "term-sys");
                }
            },

            toggleFullscreen: () => {
                if (!document.fullscreenElement) {
                    document.documentElement.requestFullscreen().catch(err => {
                        console.error(`Fullscreen error: ${err.message}`);
                    });
                } else {
                    if (document.exitFullscreen) document.exitFullscreen();
                }
            },
            
            init: async () => {
                ide.loadFiles();
                ide.setupResizers();
                ide.setupTerminal();
                
                try {
                    els.engineStatus.innerHTML = `<i class="fas fa-sync fa-spin"></i> Loading Python...`;
                    
                    // Initialize Pyodide
                    state.pyodide = await loadPyodide({
                        indexURL: "https://cdn.jsdelivr.net/pyodide/v0.25.0/full/"
                    });
                    
                    els.engineStatus.innerHTML = `<i class="fas fa-box"></i> Loading micropip...`;
                    await state.pyodide.loadPackage("micropip");

                    // CRITICAL FIX: Properly attach JS functions to Python Globals for stdout and input
                    state.pyodide.globals.set("js_print", (msg) => ide.printToTerminal(msg, 'normal'));
                    state.pyodide.globals.set("js_input_prompt", async () => await ide.requestTerminalInput());
                    
                    // Override Python's native stdout/stderr and input()
                    await state.pyodide.runPythonAsync(`
import sys
import builtins

class WebOutput:
    def write(self, text):
        js_print(text)
    def flush(self):
        pass

sys.stdout = WebOutput()
sys.stderr = WebOutput()

async def web_input(prompt=""):
    js_print(prompt)
    val = await js_input_prompt()
    return val

builtins.input = web_input
                    `);

                    els.engineStatus.innerHTML = `<i class="fas fa-check-circle text-vsc-success"></i> Python Ready`;
                    ide.printToTerminal("Python Desktop Engine (Pyodide v0.25) Initialized Successfully.\n", "term-sys");
                    ide.printToTerminal("Use 'python main.py' to run code or type standard Python shell commands.\n\n", "term-sys");
                } catch (error) {
                    els.engineStatus.innerHTML = `<i class="fas fa-times-circle text-vsc-error"></i> Engine Error`;
                    ide.printToTerminal(`\nFailed to initialize Python:\n${error.message}\n`, "term-error");
                }
            },

            loadFiles: () => {
                const saved = localStorage.getItem('vsc_files');
                if (saved) {
                    try {
                        state.files = JSON.parse(saved);
                        if (Object.keys(state.files).length === 0) throw new Error("Empty");
                    } catch (e) {
                        state.files = { 'main.py': { content: defaultCode, modified: false } };
                    }
                } else {
                    state.files = { 'main.py': { content: defaultCode, modified: false } };
                }

                const savedActive = localStorage.getItem('vsc_active_file');
                state.activeFile = (savedActive && state.files[savedActive]) ? savedActive : Object.keys(state.files)[0];
                ide.switchFile(state.activeFile);
            },

            saveFile: () => {
                if (state.activeFile) {
                    state.files[state.activeFile].modified = false;
                    localStorage.setItem('vsc_files', JSON.stringify(state.files));
                    localStorage.setItem('vsc_active_file', state.activeFile);
                    ide.renderTabs();
                }
            },

            switchFile: (filename) => {
                if (!state.files[filename]) return;
                state.activeFile = filename;
                editor.setValue(state.files[filename].content);
                els.bcFile.textContent = filename;
                ide.renderSidebar();
                ide.renderTabs();
                localStorage.setItem('vsc_active_file', filename);
            },

            createNewFile: () => {
                let name = prompt("File name:", "script.py");
                if (!name) return;
                if (!name.endsWith('.py')) name += '.py';
                if (state.files[name]) return alert("File already exists!");
                
                state.files[name] = { content: '# New Python Script\n', modified: false };
                ide.switchFile(name);
                ide.saveFile();
            },

            deleteFile: (filename, e) => {
                e.stopPropagation();
                if (Object.keys(state.files).length <= 1) return alert("You cannot delete the last file.");
                if (confirm(`Delete ${filename}?`)) {
                    delete state.files[filename];
                    if (state.activeFile === filename) {
                        state.activeFile = Object.keys(state.files)[0];
                    }
                    ide.switchFile(state.activeFile);
                    ide.saveFile();
                }
            },

            renderSidebar: () => {
                els.fileList.innerHTML = '';
                Object.keys(state.files).sort().forEach(fn => {
                    const div = document.createElement('div');
                    div.className = `file-item ${fn === state.activeFile ? 'active' : ''}`;
                    div.onclick = () => ide.switchFile(fn);
                    
                    div.innerHTML = `
                        <i class="fab fa-python"></i>
                        <span class="flex-1 truncate ml-2">${fn}</span>
                        <i class="fas fa-times text-[10px] opacity-0 hover:text-vsc-error transition-opacity" style="${fn === state.activeFile ? 'opacity:0.5' : ''}" onclick="ide.deleteFile('${fn}', event)" title="Delete"></i>
                    `;
                    
                    div.onmouseenter = () => div.querySelector('.fa-times').style.opacity = '1';
                    div.onmouseleave = () => div.querySelector('.fa-times').style.opacity = (fn === state.activeFile) ? '0.5' : '0';
                    els.fileList.appendChild(div);
                });
            },

            renderTabs: () => {
                els.tabs.innerHTML = '';
                Object.keys(state.files).sort().forEach(fn => {
                    const isMod = state.files[fn].modified;
                    const div = document.createElement('div');
                    div.className = `editor-tab ${fn === state.activeFile ? 'active' : ''}`;
                    div.onclick = () => ide.switchFile(fn);
                    
                    div.innerHTML = `
                        <i class="fab fa-python text-vsc-blue text-xs"></i>
                        <span>${fn}</span>
                        <span class="w-2 font-bold text-white ml-1">${isMod ? '●' : ''}</span>
                        <i class="fas fa-times text-[10px] close-btn ml-1" onclick="ide.deleteFile('${fn}', event)"></i>
                    `;
                    els.tabs.appendChild(div);
                });
            },

            setupTerminal: () => {
                els.termInput.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter') {
                        const val = els.termInput.value;
                        els.termInput.value = '';
                        
                        if (state.awaitingInput) {
                            const resolve = state.awaitingInput;
                            state.awaitingInput = null;
                            ide.printToTerminal(val + '\n', 'normal');
                            resolve(val);
                            return;
                        }

                        ide.printToTerminal(`user@desktop:~$ ${val}\n`, 'normal');
                        ide.handleShellCommand(val);
                    }
                });
            },

            focusTerminal: () => els.termInput.focus(),
            clearTerminal: () => els.termOutput.innerHTML = '',

            printToTerminal: (text, type = 'normal') => {
                if (text === undefined || text === null) return;
                
                // Directly create text nodes inside spans to avoid HTML escaping issues and respect \n
                const span = document.createElement('span');
                span.textContent = text;
                
                if (type === 'term-error') span.className = 'term-error';
                if (type === 'term-sys') span.className = 'term-sys';
                
                els.termOutput.appendChild(span);
                els.termWrapper.scrollTop = els.termWrapper.scrollHeight;
            },

            requestTerminalInput: () => {
                return new Promise((resolve) => {
                    state.awaitingInput = resolve;
                    els.termInputCont.querySelector('.term-prompt').textContent = ''; 
                    els.termInput.focus();
                });
            },

            handleShellCommand: async (cmdString) => {
                const str = cmdString.trim();
                if (!str) return;
                
                const args = str.split(/\s+/);
                const cmd = args[0];

                els.termInputCont.style.display = 'none';

                try {
                    if (cmd === 'clear') {
                        ide.clearTerminal();
                    } else if (cmd === 'ls') {
                        ide.printToTerminal(Object.keys(state.files).join('  ') + '\n');
                    } else if (cmd === 'python' || cmd === 'python3') {
                        const file = args[1];
                        if (file && state.files[file]) {
                            await ide.executeCode(state.files[file].content, file);
                        } else if (file) {
                            ide.printToTerminal(`python: can't open file '${file}': No such file or directory\n`, 'term-error');
                        } else {
                            ide.printToTerminal(`Please specify a file (e.g., python main.py)\n`);
                        }
                    } else if (cmd === 'pip' && args[1] === 'install') {
                        const pkg = args[2];
                        if (!pkg) {
                            ide.printToTerminal("pip install: missing package name\n", "term-error");
                        } else {
                            ide.printToTerminal(`Fetching package '${pkg}' from PyPI...\n`, 'term-sys');
                            const micropip = state.pyodide.pyimport("micropip");
                            await micropip.install(pkg);
                            ide.printToTerminal(`Successfully installed ${pkg}\n`, 'term-sys');
                        }
                    } else {
                        // Execute as direct python statement (REPL)
                        try {
                            await state.pyodide.runPythonAsync(str);
                        } catch (e) {
                            let err = e.toString();
                            ide.printToTerminal(err + '\n', 'term-error');
                        }
                    }
                } catch (err) {
                    ide.printToTerminal(err.toString() + '\n', 'term-error');
                }

                els.termInputCont.querySelector('.term-prompt').textContent = 'user@desktop:~$';
                els.termInputCont.style.display = 'flex';
                ide.focusTerminal();
            },

            runCode: async () => {
                if (state.isRunning || !state.pyodide || !state.activeFile) return;
                ide.saveFile();
                
                ide.printToTerminal(`user@desktop:~$ python ${state.activeFile}\n`, 'term-prompt');
                await ide.executeCode(editor.getValue(), state.activeFile);
            },

            executeCode: async (code, filename) => {
                state.isRunning = true;
                els.btnStop.disabled = false;
                els.engineStatus.innerHTML = `<i class="fas fa-cog fa-spin text-vsc-warn"></i> Running ${filename}`;
                els.termInputCont.style.display = 'none';

                try {
                    await state.pyodide.runPythonAsync(code);
                } catch (error) {
                    ide.printToTerminal('\n' + error.toString() + '\n', 'term-error');
                } finally {
                    state.isRunning = false;
                    els.btnStop.disabled = true;
                    els.engineStatus.innerHTML = `<i class="fas fa-check-circle text-vsc-success"></i> Python Ready`;
                    
                    if (state.awaitingInput) {
                        state.awaitingInput = null;
                        ide.printToTerminal('\n[Input Interrupted]\n', 'term-error');
                    }
                    
                    els.termInputCont.querySelector('.term-prompt').textContent = 'user@desktop:~$';
                    els.termInputCont.style.display = 'flex';
                    ide.focusTerminal();
                }
            },

            stopExecution: () => {
                if (state.isRunning) {
                    if (state.awaitingInput) {
                        state.awaitingInput(null);
                        state.awaitingInput = null;
                    }
                    state.isRunning = false;
                    els.btnStop.disabled = true;
                    els.engineStatus.innerHTML = `<i class="fas fa-check-circle text-vsc-success"></i> Python Ready`;
                    ide.printToTerminal('\n[Execution Stopped manually]\n', 'term-error');
                    
                    els.termInputCont.querySelector('.term-prompt').textContent = 'user@desktop:~$';
                    els.termInputCont.style.display = 'flex';
                    ide.focusTerminal();
                }
            },

            toggleSidebar: () => {
                state.sidebarVisible = !state.sidebarVisible;
                els.sidebar.style.width = state.sidebarVisible ? '256px' : '0px';
                els.sidebar.style.borderRightWidth = state.sidebarVisible ? '1px' : '0px';
                document.getElementById('resizer-sidebar').style.display = state.sidebarVisible ? 'block' : 'none';
                els.actExplorer.className = state.sidebarVisible 
                    ? "relative text-white group w-full flex justify-center border-l-2 border-vsc-blue"
                    : "relative text-vsc-muted hover:text-white group w-full flex justify-center border-l-2 border-transparent";
                setTimeout(() => editor.refresh(), 210); // Refresh after css transition
            },

            toggleTerminal: () => {
                state.terminalVisible = !state.terminalVisible;
                els.panel.style.display = state.terminalVisible ? 'flex' : 'none';
                document.getElementById('resizer-terminal').style.display = state.terminalVisible ? 'block' : 'none';
                editor.refresh();
            },

            setupResizers: () => {
                const rSidebar = document.getElementById('resizer-sidebar');
                let isRSidebar = false;
                
                rSidebar.addEventListener('mousedown', () => { isRSidebar = true; document.body.style.cursor = 'col-resize'; });
                document.addEventListener('mousemove', (e) => {
                    if (!isRSidebar) return;
                    const newW = Math.max(150, Math.min(e.clientX - 48, 600));
                    els.sidebar.style.width = `${newW}px`;
                });
                document.addEventListener('mouseup', () => { if(isRSidebar) { isRSidebar = false; document.body.style.cursor = 'default'; editor.refresh(); }});

                const rTerm = document.getElementById('resizer-terminal');
                let isRTerm = false;

                rTerm.addEventListener('mousedown', () => { isRTerm = true; document.body.style.cursor = 'row-resize'; });
                document.addEventListener('mousemove', (e) => {
                    if (!isRTerm) return;
                    const totalH = document.body.clientHeight - 36 - 24; // Titlebar 36px, Statusbar 24px
                    const newH = Math.max(100, Math.min(totalH - e.clientY + 36, totalH - 100));
                    els.panel.style.height = `${newH}px`;
                });
                document.addEventListener('mouseup', () => { if(isRTerm) { isRTerm = false; document.body.style.cursor = 'default'; editor.refresh(); }});
            }
        };

        window.ide = ide;
        window.addEventListener('DOMContentLoaded', ide.init);
    </script>
</body>
</html>
