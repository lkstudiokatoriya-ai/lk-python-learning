<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ललन कुमार - सिस्टम इनिशियलाइज़ेशन</title>
    
    <!-- Google Fonts: कोडिंग और हैकर लुक के लिए -->
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS (स्ट्रक्चर के लिए) -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Three.js (3D ग्राफिक्स और पार्टिकल्स के लिए) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    
    <!-- GSAP (स्मूथ सिनेमैटिक एनिमेशन के लिए) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

    <style>
        /* ==========================================
           कस्टम CSS और भारी-भरकम एनिमेशन (Glitch, Glow, Scanlines)
           ========================================== */
        
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #050505;
            color: #00ffcc;
            font-family: 'Share Tech Mono', monospace;
            overflow: hidden; /* स्क्रॉलिंग बंद */
        }

        /* 3D कैनवास का बैकग्राउंड */
        #webgl-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* मॉनिटर की तरह स्कैनलाइन इफेक्ट */
        .scanlines {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(to bottom, rgba(255,255,255,0), rgba(255,255,255,0) 50%, rgba(0,0,0,0.2) 50%, rgba(0,0,0,0.2));
            background-size: 100% 4px;
            z-index: 100;
            pointer-events: none;
            opacity: 0.6;
        }

        /* मेन UI कंटेनर */
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        /* टर्मिनल स्क्रीन (हैकर टाइपिंग) */
        #terminal {
            position: absolute;
            top: 10%;
            left: 5%;
            width: 90%;
            max-width: 600px;
            font-size: 14px;
            color: #00ffcc;
            text-shadow: 0 0 5px #00ffcc;
            text-align: left;
            z-index: 20;
        }

        .log-line {
            margin-bottom: 5px;
            opacity: 0.8;
        }

        /* प्रोफाइल फोटो और 3D रिंग्स का कंटेनर */
        #profile-container {
            position: relative;
            width: 250px;
            height: 250px;
            display: none; /* GSAP से दिखाया जाएगा */
            justify-content: center;
            align-items: center;
            z-index: 30;
        }

        /* 3D रोटेटिंग रिंग्स (CSS एनिमेशन) */
        .ring {
            position: absolute;
            border-radius: 50%;
            border: 2px solid transparent;
            box-shadow: 0 0 20px rgba(0, 255, 204, 0.5), inset 0 0 20px rgba(0, 255, 204, 0.5);
        }

        .ring-1 {
            width: 250px;
            height: 250px;
            border-top: 2px solid #00ffcc;
            border-bottom: 2px solid #00ffcc;
            animation: spin1 4s linear infinite;
        }

        .ring-2 {
            width: 220px;
            height: 220px;
            border-left: 2px solid #ff00ff;
            border-right: 2px solid #ff00ff;
            animation: spin2 3s linear infinite reverse;
        }

        .ring-3 {
            width: 280px;
            height: 280px;
            border-top: 2px solid #0088ff;
            border-bottom: 2px solid #0088ff;
            animation: spin1 6s linear infinite;
            opacity: 0.5;
        }

        /* आपकी फोटो का स्टाइल */
        #profile-img {
            width: 180px;
            height: 180px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #00ffcc;
            box-shadow: 0 0 30px #00ffcc;
            position: relative;
            z-index: 40;
            filter: contrast(1.2) brightness(1.1);
        }

        /* फॉलबैक टेक्स्ट (अगर फोटो न मिले) */
        .fallback-avatar {
            width: 180px;
            height: 180px;
            border-radius: 50%;
            background: #0f172a;
            color: #00ffcc;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 60px;
            font-family: 'Orbitron', sans-serif;
            font-weight: 900;
            border: 3px solid #00ffcc;
            box-shadow: 0 0 30px #00ffcc;
            z-index: 40;
        }

        /* मेन टाइटल (ग्लिच इफेक्ट के साथ) */
        #main-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 4rem;
            font-weight: 900;
            color: #ffffff;
            text-transform: uppercase;
            letter-spacing: 10px;
            margin-top: 30px;
            text-shadow: 0 0 10px #00ffcc, 0 0 20px #00ffcc, 0 0 40px #0088ff;
            display: none;
            position: relative;
        }

        #sub-title {
            font-size: 1.5rem;
            color: #ff00ff;
            letter-spacing: 5px;
            margin-top: 10px;
            display: none;
            text-shadow: 0 0 10px #ff00ff;
        }

        /* ग्लिच एनीमेशन क्लास */
        .glitch-text {
            animation: glitch 1s linear infinite;
        }

        /* प्रोग्रेस बार / लोडिंग बार */
        #progress-container {
            position: absolute;
            bottom: 10%;
            width: 60%;
            max-width: 500px;
            height: 4px;
            background: rgba(255,255,255,0.1);
            border-radius: 2px;
            overflow: hidden;
            display: none;
        }

        #progress-bar {
            width: 0%;
            height: 100%;
            background: #00ffcc;
            box-shadow: 0 0 10px #00ffcc;
        }

        #status-text {
            position: absolute;
            bottom: calc(10% + 15px);
            font-size: 14px;
            color: #00ffcc;
            letter-spacing: 2px;
            display: none;
        }

        /* स्किप बटन */
        #skip-btn {
            position: absolute;
            bottom: 30px;
            right: 30px;
            background: transparent;
            border: 1px solid rgba(0, 255, 204, 0.5);
            color: rgba(0, 255, 204, 0.7);
            padding: 8px 20px;
            font-family: 'Share Tech Mono', monospace;
            cursor: pointer;
            transition: all 0.3s ease;
            z-index: 1000;
        }
        #skip-btn:hover {
            background: rgba(0, 255, 204, 0.2);
            color: #00ffcc;
            border-color: #00ffcc;
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.5);
        }

        /* कीफ्रेम्स (Keyframes) */
        @keyframes spin1 { 0% { transform: rotate(0deg) rotateX(20deg) rotateY(20deg); } 100% { transform: rotate(360deg) rotateX(20deg) rotateY(20deg); } }
        @keyframes spin2 { 0% { transform: rotate(0deg) rotateX(-20deg) rotateY(-20deg); } 100% { transform: rotate(360deg) rotateX(-20deg) rotateY(-20deg); } }
        
        @keyframes glitch {
            2%, 64% { transform: translate(2px,0) skew(0deg); }
            4%, 60% { transform: translate(-2px,0) skew(0deg); }
            62% { transform: translate(0,0) skew(5deg); }
        }
        
        /* मोबाइल रिस्पॉन्सिव */
        @media (max-width: 768px) {
            #main-title { font-size: 2.5rem; letter-spacing: 5px; text-align: center; }
            #sub-title { font-size: 1rem; text-align: center; }
            #profile-img, .fallback-avatar { width: 140px; height: 140px; }
            .ring-1 { width: 200px; height: 200px; }
            .ring-2 { width: 170px; height: 170px; }
            .ring-3 { width: 230px; height: 230px; }
            #terminal { font-size: 12px; }
        }
    </style>
</head>
<body>

    <!-- 3D बैकग्राउंड -->
    <canvas id="webgl-canvas"></canvas>
    
    <!-- मॉनिटर स्कैनलाइंस -->
    <div class="scanlines"></div>

    <div id="ui-layer">
        
        <!-- फेज 1: टर्मिनल स्क्रीन -->
        <div id="terminal"></div>

        <!-- फेज 2: प्रोफाइल सेक्शन -->
        <div id="profile-container">
            <div class="ring ring-3"></div>
            <div class="ring ring-1"></div>
            <div class="ring ring-2"></div>
            
            <!-- प्रोफाइल फोटो: lalan.png या lalan.jpeg ढूँढेगा, नहीं तो 'LK' दिखाएगा -->
            <img src="lalan.png" 
                 id="profile-img"
                 alt="Lalan Kumar"
                 onerror="this.onerror=null; this.src='lalan.jpeg'; this.onerror=function(){this.style.display='none'; document.getElementById('fallback').style.display='flex';};">
            
            <div id="fallback" class="fallback-avatar" style="display: none;">LK</div>
        </div>

        <!-- फेज 3: नाम और टाइटल -->
        <h1 id="main-title">Lalan Kumar</h1>
        <h2 id="sub-title">SOFTWARE ENGINEER &lt;/&gt; PYTHON DEVELOPER</h2>

        <!-- फेज 4: रीडायरेक्ट प्रोग्रेस -->
        <div id="status-text">Please Wait ...</div>
        <div id="progress-container">
            <div id="progress-bar"></div>
        </div>

    </div>

    <!-- स्किप बटन अगर कोई इंतज़ार नहीं करना चाहता -->
    <button id="skip-btn" onclick="redirectToHome()">स्किप करें &gt;&gt;</button>

    <script>
        /* =========================================================
           भाग 1: THREE.JS 3D पार्टिकल सिस्टम (वार्प स्पीड इफेक्ट)
           ========================================================= */
        const canvas = document.getElementById('webgl-canvas');
        const scene = new THREE.Scene();
        
        // कैमरा सेटअप
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 400;

        // रेंडरर सेटअप
        const renderer = new THREE.WebGLRenderer({ canvas: canvas, alpha: true, antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);

        // पार्टिकल्स (Stars / Data nodes) बनाना
        const particlesGeometry = new THREE.BufferGeometry();
        const particlesCount = 5000; // 5000 पार्टिकल्स
        
        const posArray = new Float32Array(particlesCount * 3);
        const colorsArray = new Float32Array(particlesCount * 3);

        for(let i = 0; i < particlesCount * 3; i+=3) {
            // रैंडम 3D पोजीशन (X, Y, Z)
            posArray[i] = (Math.random() - 0.5) * 2000;
            posArray[i+1] = (Math.random() - 0.5) * 2000;
            posArray[i+2] = (Math.random() - 0.5) * 2000;

            // रंग (स्यान और नीले का मिक्स)
            colorsArray[i] = 0;           // R
            colorsArray[i+1] = Math.random(); // G (0 to 1)
            colorsArray[i+2] = 1;         // B
        }

        particlesGeometry.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
        particlesGeometry.setAttribute('color', new THREE.BufferAttribute(colorsArray, 3));

        // पार्टिकल्स का मटीरियल (कस्टम साइज और रंग)
        const particlesMaterial = new THREE.PointsMaterial({
            size: 2.5,
            vertexColors: true,
            transparent: true,
            opacity: 0.8,
            blending: THREE.AdditiveBlending
        });

        const particlesMesh = new THREE.Points(particlesGeometry, particlesMaterial);
        scene.add(particlesMesh);

        // माउस मूवमेंट के लिए इंटरएक्टिविटी
        let mouseX = 0;
        let mouseY = 0;
        let targetX = 0;
        let targetY = 0;

        document.addEventListener('mousemove', (event) => {
            mouseX = (event.clientX - window.innerWidth / 2);
            mouseY = (event.clientY - window.innerHeight / 2);
        });

        // पार्टिकल एनिमेशन लूप (Warp Speed Effect)
        let particleSpeed = 0.2;
        
        function animateParticles() {
            requestAnimationFrame(animateParticles);
            
            targetX = mouseX * 0.001;
            targetY = mouseY * 0.001;

            // कैमरा का रोटेशन माउस के हिसाब से
            camera.rotation.y += 0.05 * (targetX - camera.rotation.y);
            camera.rotation.x += 0.05 * (targetY - camera.rotation.x);

            // पार्टिकल्स को कैमरे की तरफ लाना (Speed effect)
            const positions = particlesMesh.geometry.attributes.position.array;
            for(let i = 2; i < particlesCount * 3; i+=3) {
                positions[i] += particleSpeed; // Z एक्सिस पर मूव करें
                
                // अगर पार्टिकल कैमरे के पीछे चला जाए, तो उसे वापस दूर भेज दें
                if(positions[i] > 400) {
                    positions[i] = -1000;
                }
            }
            particlesMesh.geometry.attributes.position.needsUpdate = true;
            
            // पूरा जाल धीरे-धीरे घूमेगा
            particlesMesh.rotation.z += 0.0005;

            renderer.render(scene, camera);
        }
        
        // 3D कैनवास को रिसाइज करने का फंक्शन
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        /* =========================================================
           भाग 2: सिनेमैटिक टाइमलाइन और लॉजिक (GSAP & Terminal)
           ========================================================= */
        
        // होम पेज का URL जहाँ रीडायरेक्ट करना है
        const TARGET_URL = "home.html";
        let isRedirecting = false;

        function redirectToHome() {
            if(isRedirecting) return;
            isRedirecting = true;
            
            // एक्जिट एनिमेशन
            gsap.to("#ui-layer", { opacity: 0, duration: 0.5 });
            particleSpeed = 20; // 3D तारों की स्पीड अचानक बढ़ा दें (Warp jump)
            
            setTimeout(() => {
                window.location.href = TARGET_URL;
            }, 1000);
        }

        // टर्मिनल के लिए हैकर स्टाइल टेक्स्ट
        const terminalLines = [
            "[सिस्टम बूट] - कोर मॉड्यूल इनिशियलाइज़ किए जा रहे हैं...",
            "[मेमोरी चेक] - 0x00FA89B मेमोरी लोकेटेड। स्थिति: स्थिर।",
            "[नेटवर्क] - एन्क्रिप्टेड सर्वर से कनेक्शन स्थापित।",
            "> IMPORTING PYTHON_LIBRARIES...",
            "> LOADING NUMPY, PANDAS, TENSORFLOW...",
            "[सिक्योरिटी] - एक्सेस ग्रांटेड। फायरवॉल बाईपास सफल।",
            "[प्रोफाइल डेटा] - डिक्रिप्टिंग एन्टीटी: 'LALAN KUMAR'...",
            "> रेंडरिंग 3D एनवायरनमेंट..."
        ];

        const terminalEl = document.getElementById("terminal");

        // एक-एक करके लाइन टाइप करने का फंक्शन
        async function typeTerminalLogs() {
            for (let i = 0; i < terminalLines.length; i++) {
                await new Promise(resolve => setTimeout(resolve, Math.random() * 400 + 200)); // रैंडम डिले
                const line = document.createElement("div");
                line.className = "log-line";
                line.textContent = terminalLines[i];
                terminalEl.appendChild(line);
                
                // ग्लिच इफेक्ट कुछ लाइनों पर
                if(i % 3 === 0) {
                    line.classList.add('glitch-text');
                    setTimeout(() => line.classList.remove('glitch-text'), 500);
                }
            }
            
            // टर्मिनल का काम खत्म, इसे छिपा दें
            setTimeout(() => {
                gsap.to(terminalEl, { opacity: 0, duration: 1, y: -50, display: 'none' });
                startMainReveal(); // अगला फेज शुरू करें
            }, 800);
        }

        // मुख्य प्रोफाइल और नाम दिखाने का एनिमेशन (GSAP)
        function startMainReveal() {
            // 3D पार्टिकल्स की स्पीड तेज करें
            gsap.to(window, { particleSpeed: 5, duration: 2, ease: "power2.inOut" });

            const tl = gsap.timeline();

            // 1. प्रोफाइल फोटो और रिंग्स का ज़ूम इन
            tl.set("#profile-container", { display: "flex", scale: 0, opacity: 0 })
              .to("#profile-container", { scale: 1, opacity: 1, duration: 1.5, ease: "back.out(1.7)" })
              
            // 2. मेन टाइटल (Lalan Kumar) का आना
              .set("#main-title", { display: "block", y: 50, opacity: 0 })
              .to("#main-title", { y: 0, opacity: 1, duration: 1, ease: "power3.out" }, "-=0.5")
              
            // 3. सब-टाइटल (Software Engineer) का आना
              .set("#sub-title", { display: "block", y: 20, opacity: 0 })
              .to("#sub-title", { y: 0, opacity: 1, duration: 0.8, ease: "power2.out" }, "-=0.5")
              
            // 4. टाइटल में ग्लिच इफेक्ट जोड़ना
              .call(() => {
                  document.getElementById("main-title").classList.add("glitch-text");
              })
              
            // 5. प्रोग्रेस बार और टेक्स्ट का आना
              .set(["#progress-container", "#status-text"], { display: "block", opacity: 0 })
              .to(["#progress-container", "#status-text"], { opacity: 1, duration: 1 }, "+=0.5")
              
            // 6. प्रोग्रेस बार को 0 से 100% तक भरना (3 सेकंड में)
              .to("#progress-bar", { width: "100%", duration: 3, ease: "linear" })
              
            // 7. रीडायरेक्ट फंक्शन को कॉल करना
              .call(redirectToHome);
        }

        // =========================================================
        // एग्जीक्यूशन शुरू (Execution Start)
        // =========================================================
        
        window.onload = function() {
            // 1. 3D बैकग्राउंड शुरू करें
            animateParticles();
            
            // 2. टर्मिनल हैकर टाइपिंग शुरू करें
            setTimeout(typeTerminalLogs, 500);
        };

    </script>
</body>
</html>
