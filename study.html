<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LK PYTHON LEARNING | Premium Study Platform</title>
    
    <!-- Tailwind CSS with Typography Plugin -->
    <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
    
    <!-- Google Fonts: Outfit for UI, JetBrains Mono for Code -->
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- PrismJS syntax highlighting (Tomorrow Night Theme) & Line Numbers -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css" rel="stylesheet" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/plugins/line-numbers/prism-line-numbers.min.css" rel="stylesheet" />
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Outfit', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    },
                    colors: {
                        navy: {
                            900: '#0a0f1c',
                            800: '#111827',
                            700: '#1e293b',
                        },
                        accent: {
                            400: '#22d3ee', // Cyan
                            500: '#0ea5e9', // Light Blue
                            600: '#2563eb', // Blue
                        }
                    },
                    animation: {
                        'glow': 'glow 3s ease-in-out infinite alternate',
                        'fade-in': 'fadeIn 0.3s ease-out forwards',
                        'slide-up': 'slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards',
                    },
                    keyframes: {
                        glow: {
                            '0%': { boxShadow: '0 0 10px rgba(34, 211, 238, 0.1)' },
                            '100%': { boxShadow: '0 0 20px rgba(34, 211, 238, 0.4)' }
                        },
                        fadeIn: {
                            '0%': { opacity: '0' },
                            '100%': { opacity: '1' }
                        },
                        slideUp: {
                            '0%': { opacity: '0', transform: 'translateY(20px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' }
                        }
                    }
                }
            }
        }
    </script>

    <style>
        /* Base Premium Styling */
        body { 
            background-color: #0a0f1c; 
            color: #f8fafc; 
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(34, 211, 238, 0.04) 0%, transparent 50%),
                radial-gradient(circle at 85% 30%, rgba(37, 99, 235, 0.04) 0%, transparent 50%);
            background-attachment: fixed;
        }
        
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #0a0f1c; }
        ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #38bdf8; }

        /* Glassmorphism Components */
        .glass-panel {
            background: rgba(17, 24, 39, 0.6);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
        }

        .glass-card {
            background: linear-gradient(145deg, rgba(30, 41, 59, 0.4) 0%, rgba(17, 24, 39, 0.6) 100%);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }
        
        .glass-card:hover {
            transform: translateY(-5px);
            border-color: rgba(34, 211, 238, 0.4);
            box-shadow: 0 10px 30px -10px rgba(34, 211, 238, 0.2);
        }

        .gradient-text {
            background: linear-gradient(to right, #22d3ee, #3b82f6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Prism Code Block Customization */
        pre[class*="language-"] {
            margin: 0 !important;
            border-radius: 0 0 0.75rem 0.75rem !important;
            background: #0d1321 !important;
            border: none !important;
            font-family: 'JetBrains Mono', monospace !important;
            font-size: 0.9rem;
        }
        
        code[class*="language-"] { font-family: 'JetBrains Mono', monospace !important; }

        /* Search Input Styling */
        .search-glass {
            background: rgba(30, 41, 59, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.2);
            transition: all 0.3s ease;
        }
        .search-glass:focus-within {
            background: rgba(30, 41, 59, 0.8);
            border-color: rgba(34, 211, 238, 0.5);
            box-shadow: 0 0 15px rgba(34, 211, 238, 0.15), inset 0 2px 4px rgba(0,0,0,0.2);
        }

        /* Terminal Styling */
        .terminal-output {
            background-color: #05080f;
            color: #a5b4fc;
            font-family: 'JetBrains Mono', monospace;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        /* Loader Animation */
        .premium-loader {
            width: 48px;
            height: 48px;
            border: 3px solid rgba(34, 211, 238, 0.1);
            border-radius: 50%;
            border-top-color: #22d3ee;
            animation: spin 1s ease-in-out infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        
        /* Markdown Customizations */
        .prose-premium :where(code):not(:where([class~="not-prose"] *)) {
            background-color: rgba(34, 211, 238, 0.1);
            color: #a5b4fc;
            padding: 0.2rem 0.4rem;
            border-radius: 0.375rem;
            font-weight: 500;
        }

        /* Hidden Print Container */
        #pdf-render-container {
            position: absolute;
            left: -9999px;
            top: -9999px;
            background: white !important;
            color: black !important;
            width: 800px; /* Fixed width for consistent rendering */
        }
    </style>
</head>
<body class="antialiased min-h-screen flex flex-col selection:bg-accent-400 selection:text-navy-900">

    <!-- Navigation Header -->
    <header class="glass-panel sticky top-0 z-50 w-full border-b border-white/10">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex flex-col md:flex-row items-center justify-between h-auto md:h-20 py-4 md:py-0 gap-4">
                
                <!-- Logo / Title -->
                <div class="flex items-center gap-3 cursor-pointer group" onclick="app.navigate('')">
                    <div class="bg-gradient-to-br from-accent-400 to-accent-600 p-2.5 rounded-xl shadow-lg shadow-accent-500/20 group-hover:shadow-accent-500/40 transition-all duration-300">
                        <i class="fab fa-python text-3xl text-white"></i>
                    </div>
                    <div>
                        <h1 class="text-xl md:text-2xl font-extrabold text-white tracking-tight">LK PYTHON <span class="gradient-text">LEARNING</span></h1>
                        <p class="text-xs text-accent-400 font-semibold tracking-widest uppercase opacity-80">Premium Study Platform</p>
                    </div>
                </div>

                <!-- Global Search -->
                <div class="relative w-full md:w-[400px]">
                    <div class="relative search-glass rounded-xl flex items-center">
                        <span class="pl-4 text-slate-400">
                            <i class="fas fa-search"></i>
                        </span>
                        <input type="text" id="searchInput" 
                            class="w-full pl-3 pr-4 py-3 bg-transparent text-white placeholder-slate-400 focus:outline-none sm:text-sm font-medium"
                            placeholder="Search units, topics, or Python files..." autocomplete="off">
                        
                        <!-- Search Results Dropdown -->
                        <div id="searchResults" class="absolute top-full left-0 right-0 mt-2 glass-panel rounded-xl hidden max-h-[400px] overflow-y-auto z-50 border border-white/10 shadow-2xl">
                            <!-- Populated via JS -->
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="flex-grow w-full max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 relative">
        
        <!-- Breadcrumb Navigation -->
        <nav class="flex items-center space-x-2 text-sm text-slate-400 mb-8 overflow-x-auto whitespace-nowrap pb-2 font-medium" id="breadcrumb">
            <!-- Populated via JS -->
        </nav>

        <!-- Dynamic Content Container -->
        <div id="content-container" class="relative min-h-[400px]">
            <!-- Viewers and Cards will be injected here -->
        </div>

    </main>

    <!-- Footer -->
    <footer class="border-t border-white/10 py-8 mt-auto glass-panel">
        <div class="max-w-7xl mx-auto px-4 text-center">
            <p class="text-slate-400 text-sm font-medium">
                &copy; <span id="year"></span> LK Python Learning. 
                <span class="block sm:inline mt-1 sm:mt-0 text-slate-500">Curated by lkstudiokatoriya-ai.</span>
            </p>
        </div>
    </footer>

    <!-- Hidden Container for PDF Generation -->
    <div id="pdf-render-container"></div>

    <!-- Libraries -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    
    <!-- PrismJS Core and Plugins -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-python.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/plugins/line-numbers/prism-line-numbers.min.js"></script>

    <!-- Pyodide for Python Execution -->
    <script src="https://cdn.jsdelivr.net/pyodide/v0.25.0/full/pyodide.js"></script>

    <script>
        // --- Core Application Logic ---
        document.getElementById('year').textContent = new Date().getFullYear();

        const CONFIG = {
            owner: 'lkstudiokatoriya-ai',
            repo: 'lk-python-learning',
            branch: 'main'
        };

        const state = {
            fullTree: [],
            currentPath: '',
            fileCache: {},
            pyodideInstance: null,
            isPyodideLoading: false
        };

        const elements = {
            container: document.getElementById('content-container'),
            breadcrumb: document.getElementById('breadcrumb'),
            searchInput: document.getElementById('searchInput'),
            searchResults: document.getElementById('searchResults'),
            pdfContainer: document.getElementById('pdf-render-container')
        };

        // --- Pyodide Initialization & Execution Logic ---
        async function loadPythonEngine() {
            if (state.pyodideInstance) return state.pyodideInstance;
            if (state.isPyodideLoading) {
                // Wait until loaded if already loading
                while(state.isPyodideLoading) { await new Promise(r => setTimeout(r, 100)); }
                return state.pyodideInstance;
            }

            state.isPyodideLoading = true;
            try {
                const pyodide = await loadPyodide();
                
                // Set up Python environment to intercept stdout and handle input()
                window.appendTerminalOutput = (text) => {
                    const outputEl = document.getElementById('py-output');
                    if (outputEl) {
                        outputEl.textContent += text;
                        outputEl.scrollTop = outputEl.scrollHeight;
                    }
                };

                window.promptUserForInput = (promptText) => {
                    if (promptText) window.appendTerminalOutput(promptText);
                    const userInput = window.prompt(promptText || "Python Program Input:") || "";
                    window.appendTerminalOutput(userInput + "\n");
                    return userInput;
                };

                await pyodide.runPythonAsync(`
                    import sys
                    import js
                    import builtins

                    class CustomIO:
                        def write(self, text):
                            js.appendTerminalOutput(text)
                        def flush(self):
                            pass

                    sys.stdout = CustomIO()
                    sys.stderr = CustomIO()

                    def custom_input(prompt=""):
                        return js.promptUserForInput(prompt)

                    builtins.input = custom_input
                `);

                state.pyodideInstance = pyodide;
                return pyodide;
            } catch (err) {
                console.error("Pyodide loading failed", err);
                throw err;
            } finally {
                state.isPyodideLoading = false;
            }
        }

        window.runPythonProgram = async (code) => {
            const outputEl = document.getElementById('py-output');
            const runBtn = document.getElementById('runBtn');
            const originalBtnHtml = runBtn.innerHTML;
            
            outputEl.textContent = "Initializing Python Environment...\n";
            runBtn.disabled = true;
            runBtn.innerHTML = `<i class="fas fa-spinner fa-spin"></i> Running...`;

            try {
                const pyodide = await loadPythonEngine();
                outputEl.textContent = ">>> Executing Program...\n\n";
                await pyodide.runPythonAsync(code);
                outputEl.textContent += "\n>>> Execution Completed.";
            } catch (err) {
                // Formatting Pyodide errors beautifully
                let errorStr = err.toString();
                if (errorStr.includes("PythonError:")) {
                    errorStr = errorStr.split('PythonError:').pop().trim();
                }
                outputEl.textContent += `\n❌ Error:\n${errorStr}`;
            } finally {
                runBtn.disabled = false;
                runBtn.innerHTML = originalBtnHtml;
            }
        };

        window.clearPythonOutput = () => {
            const outputEl = document.getElementById('py-output');
            if (outputEl) outputEl.textContent = "Terminal cleared. Ready.\n";
        };


        // --- Application Initialization ---
        async function initApp() {
            renderLoading('Initializing Premium Study Engine...');
            try {
                const response = await fetch(`https://api.github.com/repos/${CONFIG.owner}/${CONFIG.repo}/git/trees/${CONFIG.branch}?recursive=1`);
                if (!response.ok) throw new Error('Failed to connect to repository structure.');
                const data = await response.json();
                
                state.fullTree = data.tree.filter(item => 
                    !item.path.startsWith('.') && 
                    !item.path.includes('/.') &&
                    (item.type === 'tree' || item.path.endsWith('.py') || item.path.endsWith('.md'))
                );

                // Start preloading Python engine in background
                setTimeout(loadPythonEngine, 1000); 

                app.navigate('');
            } catch (error) {
                renderError('Unable to load study material. Please check connection and try again.');
            }
        }

        // --- Formatting Helpers ---
        const utils = {
            formatName: (pathName) => {
                let name = pathName.split('/').pop();
                name = name.replace(/\.py$/, '').replace(/\.md$/, '');
                name = name.replace(/[-_]/g, ' ');
                return name.replace(/\b\w/g, l => l.toUpperCase()); // Capitalize words
            },
            
            getFileDetails: (filename) => {
                if (filename.endsWith('.py')) return { icon: 'fab fa-python', color: 'text-accent-400', label: 'Python Script', bg: 'bg-accent-400/10', border: 'border-accent-400/20' };
                if (filename.endsWith('.md')) return { icon: 'fas fa-book', color: 'text-emerald-400', label: 'Study Notes', bg: 'bg-emerald-400/10', border: 'border-emerald-400/20' };
                return { icon: 'fas fa-folder-open', color: 'text-amber-400', label: 'Folder', bg: 'bg-amber-400/10', border: 'border-amber-400/20' };
            },

            getChildren: (path) => {
                const prefix = path === '' ? '' : `${path}/`;
                return state.fullTree.filter(item => {
                    if (!item.path.startsWith(prefix)) return false;
                    const rem = item.path.substring(prefix.length);
                    return rem.length > 0 && !rem.includes('/');
                }).sort((a, b) => {
                    if (a.type !== b.type) return a.type === 'tree' ? -1 : 1;
                    return a.path.localeCompare(b.path);
                });
            }
        };

        // --- Navigation and View Rendering ---
        const app = {
            navigate: async (path) => {
                state.currentPath = path;
                elements.searchInput.value = '';
                elements.searchResults.classList.add('hidden');
                
                app.updateBreadcrumbs();
                const item = state.fullTree.find(i => i.path === path);
                
                if (item && item.type === 'blob') {
                    await app.renderFileViewer(item);
                } else {
                    app.renderFolderView(path);
                }
                window.scrollTo({ top: 0, behavior: 'smooth' });
            },

            updateBreadcrumbs: () => {
                const parts = state.currentPath.split('/').filter(p => p);
                let html = `
                    <button onclick="app.navigate('')" class="hover:text-white transition-colors flex items-center gap-1.5 px-3 py-1.5 rounded-lg hover:bg-white/5 border border-transparent hover:border-white/10">
                        <i class="fas fa-home"></i> Home
                    </button>
                `;

                let accumPath = '';
                parts.forEach((part, index) => {
                    accumPath += (accumPath ? '/' : '') + part;
                    const isLast = index === parts.length - 1;
                    const displayName = utils.formatName(part);
                    
                    html += `<i class="fas fa-chevron-right text-[10px] text-slate-600 mx-1"></i>`;
                    
                    if (isLast) {
                        html += `<span class="px-3 py-1.5 text-accent-400 font-semibold truncate max-w-[200px] sm:max-w-xs drop-shadow-[0_0_8px_rgba(34,211,238,0.3)]">${displayName}</span>`;
                    } else {
                        html += `<button onclick="app.navigate('${accumPath}')" class="hover:text-white transition-colors px-3 py-1.5 rounded-lg hover:bg-white/5 border border-transparent hover:border-white/10 truncate max-w-[150px] sm:max-w-xs">${displayName}</button>`;
                    }
                });
                elements.breadcrumb.innerHTML = html;
            },

            renderFolderView: (path) => {
                const children = utils.getChildren(path);
                if (children.length === 0) return renderEmptyFolder();

                let html = `
                    <div class="mb-8 flex items-center justify-between animate-fade-in">
                        <h2 class="text-2xl md:text-3xl font-bold text-white flex items-center gap-4">
                            ${path === '' ? 
                                '<div class="w-12 h-12 rounded-xl bg-gradient-to-br from-indigo-500 to-purple-600 flex items-center justify-center shadow-lg"><i class="fas fa-layer-group text-white"></i></div> Course Units' 
                                : `<div class="w-12 h-12 rounded-xl bg-gradient-to-br from-amber-400 to-orange-500 flex items-center justify-center shadow-lg"><i class="fas fa-folder-open text-white"></i></div> ${utils.formatName(path)}`}
                        </h2>
                        ${path !== '' ? `
                            <button onclick="app.navigate('${path.split('/').slice(0, -1).join('/')}')" 
                                class="px-5 py-2.5 glass-panel hover:bg-white/10 text-white rounded-xl text-sm transition-all font-semibold flex items-center gap-2 group">
                                <i class="fas fa-arrow-left group-hover:-translate-x-1 transition-transform"></i> Back
                            </button>
                        ` : ''}
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 animate-slide-up">
                `;

                children.forEach(item => {
                    const isFolder = item.type === 'tree';
                    const name = utils.formatName(item.path);
                    const details = isFolder ? utils.getFileDetails('folder') : utils.getFileDetails(item.path);

                    html += `
                        <div onclick="app.navigate('${item.path}')" 
                            class="glass-card rounded-2xl p-6 cursor-pointer group flex flex-col justify-between h-[160px] relative overflow-hidden">
                            <!-- Background Accent Glow -->
                            <div class="absolute -right-10 -top-10 w-32 h-32 ${details.bg} blur-3xl rounded-full opacity-0 group-hover:opacity-50 transition-opacity duration-500"></div>
                            
                            <div class="relative z-10">
                                <div class="mb-4 w-12 h-12 rounded-xl flex items-center justify-center border ${details.border} ${details.bg} group-hover:scale-110 transition-transform duration-300">
                                    <i class="${details.icon} ${details.color} text-2xl"></i>
                                </div>
                                <h3 class="text-lg font-bold text-white group-hover:${details.color} transition-colors line-clamp-2">
                                    ${name}
                                </h3>
                            </div>
                            <div class="relative z-10 mt-auto flex items-center justify-between text-sm text-slate-400 font-medium">
                                <span>${details.label}</span>
                                <div class="w-8 h-8 rounded-full bg-white/5 flex items-center justify-center group-hover:bg-${details.color.split('-')[1]}-500/20 group-hover:text-${details.color.split('-')[1]}-400 transition-all">
                                    <i class="fas fa-arrow-right -rotate-45 group-hover:rotate-0 transition-transform"></i>
                                </div>
                            </div>
                        </div>
                    `;
                });

                html += `</div>`;
                elements.container.innerHTML = html;
            },

            renderFileViewer: async (item) => {
                const parentPath = item.path.split('/').slice(0, -1).join('/');
                const fileName = item.path.split('/').pop();
                
                renderLoading(`Loading ${fileName}...`);
                try {
                    let content = state.fileCache[item.path];
                    if (!content) {
                        const response = await fetch(`https://raw.githubusercontent.com/${CONFIG.owner}/${CONFIG.repo}/${CONFIG.branch}/${item.path}`);
                        if (!response.ok) throw new Error('Failed to fetch file');
                        content = await response.text();
                        state.fileCache[item.path] = content;
                    }

                    if (fileName.endsWith('.py')) {
                        app.renderPythonRunner(fileName, parentPath, content);
                    } else {
                        app.renderMarkdownViewer(fileName, parentPath, content);
                    }
                } catch (error) {
                    renderError(`Unable to load ${fileName}. Network error or file missing.`);
                }
            },

            renderPythonRunner: (fileName, parentPath, content) => {
                const safeContent = content.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                const rawCodeBase64 = btoa(unescape(encodeURIComponent(content))); // Safe encoding for JS passing

                elements.container.innerHTML = `
                    <div class="animate-slide-up w-full">
                        <div class="glass-panel border border-white/10 rounded-2xl overflow-hidden shadow-2xl flex flex-col">
                            
                            <!-- Header Toolbar -->
                            <div class="bg-navy-800/80 px-4 py-3 sm:px-6 sm:py-4 border-b border-white/5 flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4">
                                <div class="flex items-center gap-4">
                                    <button onclick="app.navigate('${parentPath}')" class="w-10 h-10 rounded-full hover:bg-white/10 flex items-center justify-center text-slate-400 hover:text-white transition-colors">
                                        <i class="fas fa-arrow-left"></i>
                                    </button>
                                    <div class="flex items-center gap-3">
                                        <div class="w-10 h-10 rounded-lg bg-accent-400/10 border border-accent-400/20 flex items-center justify-center">
                                            <i class="fab fa-python text-xl text-accent-400"></i>
                                        </div>
                                        <div>
                                            <h2 class="text-white font-bold text-lg leading-tight tracking-wide">${fileName}</h2>
                                            <p class="text-xs text-slate-400 font-medium">Python Source Code</p>
                                        </div>
                                    </div>
                                </div>
                                
                                <div class="flex items-center gap-3 w-full sm:w-auto">
                                    <button onclick="app.copyCode()" id="copyBtn" class="flex-1 sm:flex-none px-4 py-2.5 bg-white/5 hover:bg-white/10 border border-white/10 text-white rounded-xl transition-all text-sm font-semibold flex items-center justify-center gap-2 group">
                                        <i class="fas fa-copy text-slate-400 group-hover:text-white transition-colors"></i> <span>Copy</span>
                                    </button>
                                    <button onclick="runPythonProgram(decodeURIComponent(escape(atob('${rawCodeBase64}'))))" id="runBtn" class="flex-1 sm:flex-none px-6 py-2.5 bg-gradient-to-r from-accent-500 to-accent-600 hover:from-accent-400 hover:to-accent-500 shadow-lg shadow-accent-500/25 text-white rounded-xl transition-all text-sm font-bold flex items-center justify-center gap-2 transform hover:-translate-y-0.5">
                                        <i class="fas fa-play"></i> Run Code
                                    </button>
                                </div>
                            </div>
                            
                            <!-- Editor / Code Area -->
                            <div class="relative bg-[#1d1f21] w-full overflow-hidden border-b border-white/5">
                                <pre class="line-numbers !m-0 !rounded-none !border-0 text-sm max-h-[50vh]"><code class="language-python" id="codeBlock">${safeContent}</code></pre>
                            </div>

                            <!-- Integrated Terminal / Output -->
                            <div class="bg-navy-900 flex flex-col">
                                <div class="flex items-center justify-between px-4 py-2 bg-navy-800/50 border-b border-white/5">
                                    <span class="text-xs font-bold text-slate-400 uppercase tracking-wider flex items-center gap-2">
                                        <i class="fas fa-terminal"></i> Terminal Output
                                    </span>
                                    <button onclick="clearPythonOutput()" class="text-xs text-slate-500 hover:text-white transition-colors">
                                        <i class="fas fa-eraser mr-1"></i> Clear
                                    </button>
                                </div>
                                <div class="p-4 h-[200px] overflow-y-auto">
                                    <pre id="py-output" class="terminal-output text-sm">Ready. Click 'Run Code' to execute.\n</pre>
                                </div>
                            </div>

                        </div>
                    </div>
                `;
                Prism.highlightAll();
            },

            renderMarkdownViewer: (fileName, parentPath, content) => {
                marked.setOptions({
                    breaks: true, gfm: true,
                    highlight: (code, lang) => Prism.languages[lang] ? Prism.highlight(code, Prism.languages[lang], lang) : code
                });

                const htmlContent = marked.parse(content);
                const title = utils.formatName(fileName);

                elements.container.innerHTML = `
                    <div class="animate-slide-up w-full">
                        <div class="glass-panel border border-white/10 rounded-3xl overflow-hidden shadow-2xl relative" id="notesContainer">
                            
                            <!-- Header Toolbar -->
                            <div class="bg-navy-800/80 px-5 py-4 border-b border-white/5 flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4">
                                <div class="flex items-center gap-4">
                                    <button onclick="app.navigate('${parentPath}')" class="w-10 h-10 rounded-full hover:bg-white/10 flex items-center justify-center text-slate-400 hover:text-white transition-colors">
                                        <i class="fas fa-arrow-left"></i>
                                    </button>
                                    <div class="flex items-center gap-3">
                                        <div class="w-10 h-10 rounded-lg bg-emerald-400/10 border border-emerald-400/20 flex items-center justify-center">
                                            <i class="fas fa-book text-xl text-emerald-400"></i>
                                        </div>
                                        <div>
                                            <h2 class="text-white font-bold text-lg leading-tight tracking-wide">${title}</h2>
                                            <p class="text-xs text-slate-400 font-medium">Digital Study Notes</p>
                                        </div>
                                    </div>
                                </div>
                                <button onclick="app.downloadPDF('${title}', \`${encodeURIComponent(htmlContent)}\`)" id="pdfBtn" class="w-full sm:w-auto px-5 py-2.5 bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-400 hover:to-teal-500 shadow-lg shadow-emerald-500/25 text-white rounded-xl transition-all text-sm font-bold flex items-center justify-center gap-2 transform hover:-translate-y-0.5">
                                    <i class="fas fa-file-pdf"></i> Download PDF
                                </button>
                            </div>

                            <!-- Note Content Area -->
                            <div class="p-6 md:p-12 lg:px-20 bg-navy-900/50">
                                <article class="prose prose-invert prose-premium max-w-4xl mx-auto prose-headings:font-bold prose-headings:text-white prose-h1:text-3xl prose-h2:text-accent-400 prose-h2:border-b prose-h2:border-white/10 prose-h2:pb-2 prose-a:text-accent-400 hover:prose-a:text-accent-300 prose-pre:bg-[#0d1321] prose-pre:border prose-pre:border-white/10 prose-pre:shadow-xl prose-img:rounded-xl">
                                    ${htmlContent}
                                </article>
                            </div>
                        </div>
                    </div>
                `;
            },

            copyCode: () => {
                const code = document.getElementById('codeBlock').textContent;
                const btn = document.getElementById('copyBtn');
                const span = btn.querySelector('span');
                const icon = btn.querySelector('i');

                const successUI = () => {
                    span.textContent = 'Copied!';
                    icon.className = 'fas fa-check text-emerald-400';
                    btn.classList.add('border-emerald-500/50', 'bg-emerald-500/10');
                    setTimeout(() => {
                        span.textContent = 'Copy';
                        icon.className = 'fas fa-copy text-slate-400 group-hover:text-white transition-colors';
                        btn.classList.remove('border-emerald-500/50', 'bg-emerald-500/10');
                    }, 2000);
                };

                navigator.clipboard.writeText(code).then(successUI).catch(() => {
                    const textarea = document.createElement('textarea');
                    textarea.value = code; document.body.appendChild(textarea);
                    textarea.select(); document.execCommand('copy');
                    document.body.removeChild(textarea); successUI();
                });
            },

            downloadPDF: (title, encodedHtmlContent) => {
                const btn = document.getElementById('pdfBtn');
                const originalHtml = btn.innerHTML;
                btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Generating PDF...';
                btn.disabled = true;

                // Decode HTML content for PDF
                const contentHtml = decodeURIComponent(encodedHtmlContent);

                // Build a clean, light-themed HTML structure for PDF rendering
                // We use standard 'prose' instead of 'prose-invert' for black on white.
                const pdfHtml = `
                    <div style="padding: 40px; font-family: 'Outfit', sans-serif; color: #000; background: #fff;">
                        <div style="border-bottom: 2px solid #3b82f6; padding-bottom: 20px; margin-bottom: 30px;">
                            <h1 style="font-size: 28px; font-weight: 800; color: #1e293b; margin: 0;">LK PYTHON LEARNING</h1>
                            <p style="font-size: 14px; color: #64748b; margin-top: 5px; text-transform: uppercase; font-weight: 600;">Premium Study Notes • ${title}</p>
                        </div>
                        <article class="prose max-w-none prose-headings:text-[#0f172a] prose-h2:text-[#2563eb] prose-h2:border-b prose-h2:border-gray-200 prose-h2:pb-2 prose-pre:bg-gray-100 prose-pre:text-gray-900 prose-pre:border prose-pre:border-gray-300">
                            ${contentHtml}
                        </article>
                        <div style="margin-top: 50px; text-align: center; font-size: 12px; color: #94a3b8; border-top: 1px solid #e2e8f0; padding-top: 20px;">
                            Generated from LK Python Learning Platform
                        </div>
                    </div>
                `;

                elements.pdfContainer.innerHTML = pdfHtml;

                const opt = {
                    margin:       [10, 10, 10, 10],
                    filename:     `${title.replace(/\s+/g, '_')}_Notes.pdf`,
                    image:        { type: 'jpeg', quality: 0.98 },
                    html2canvas:  { scale: 2, useCORS: true, backgroundColor: '#ffffff', windowWidth: 800 },
                    jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
                };

                html2pdf().set(opt).from(elements.pdfContainer).save().then(() => {
                    btn.innerHTML = originalHtml;
                    btn.disabled = false;
                    elements.pdfContainer.innerHTML = ''; // Cleanup
                }).catch(err => {
                    console.error("PDF Gen Error:", err);
                    alert("Error generating PDF.");
                    btn.innerHTML = originalHtml;
                    btn.disabled = false;
                });
            },

            handleSearch: (query) => {
                if (query.trim().length < 2) {
                    elements.searchResults.classList.add('hidden');
                    return;
                }
                const lowercaseQuery = query.toLowerCase();
                const results = state.fullTree.filter(item => {
                    const formattedName = utils.formatName(item.path).toLowerCase();
                    return formattedName.includes(lowercaseQuery) || item.path.toLowerCase().includes(lowercaseQuery);
                }).slice(0, 8); 

                if (results.length === 0) {
                    elements.searchResults.innerHTML = `<div class="p-5 text-center text-slate-400 font-medium">No material found for "${query}"</div>`;
                } else {
                    let html = '<ul class="py-2">';
                    results.forEach(item => {
                        const isFolder = item.type === 'tree';
                        const details = isFolder ? utils.getFileDetails('folder') : utils.getFileDetails(item.path);
                        const parts = item.path.split('/');
                        const name = utils.formatName(parts.pop());
                        const parent = parts.join(' / ').replace(/[-_]/g, ' ');

                        html += `
                            <li>
                                <button onclick="app.navigate('${item.path}')" class="w-full text-left px-5 py-3 hover:bg-white/5 transition flex items-center gap-4 focus:outline-none focus:bg-white/10 group">
                                    <div class="w-10 h-10 rounded-lg ${details.bg} border ${details.border} flex flex-shrink-0 items-center justify-center">
                                        <i class="${details.icon} ${details.color}"></i>
                                    </div>
                                    <div class="overflow-hidden">
                                        <div class="text-slate-200 font-bold text-sm group-hover:text-white transition-colors truncate">${name}</div>
                                        ${parent ? `<div class="text-xs text-slate-500 mt-0.5 truncate">${parent}</div>` : ''}
                                    </div>
                                </button>
                            </li>
                        `;
                    });
                    html += '</ul>';
                    elements.searchResults.innerHTML = html;
                }
                elements.searchResults.classList.remove('hidden');
            }
        };

        // --- UI Feedback Components ---
        function renderLoading(message) {
            elements.container.innerHTML = `
                <div class="flex flex-col items-center justify-center py-32 animate-fade-in">
                    <div class="premium-loader mb-6"></div>
                    <p class="text-accent-400 font-semibold tracking-wide animate-pulse">${message}</p>
                </div>
            `;
        }

        function renderError(message) {
            elements.container.innerHTML = `
                <div class="glass-panel border-red-500/30 rounded-2xl p-10 text-center max-w-xl mx-auto mt-10 animate-slide-up relative overflow-hidden">
                    <div class="absolute inset-0 bg-red-500/5"></div>
                    <div class="relative z-10">
                        <div class="w-16 h-16 bg-red-500/10 rounded-2xl border border-red-500/20 flex items-center justify-center mx-auto mb-6">
                            <i class="fas fa-exclamation-circle text-3xl text-red-400 shadow-sm"></i>
                        </div>
                        <h3 class="text-2xl font-bold text-white mb-3">System Notification</h3>
                        <p class="text-slate-400 mb-8 font-medium">${message}</p>
                        <button onclick="initApp()" class="px-8 py-3 bg-white/5 hover:bg-white/10 text-white rounded-xl transition-all font-bold border border-white/10 flex items-center gap-2 mx-auto hover:shadow-lg">
                            <i class="fas fa-sync-alt"></i> Retry Connection
                        </button>
                    </div>
                </div>
            `;
        }

        function renderEmptyFolder() {
            elements.container.innerHTML = `
                <div class="glass-panel rounded-2xl p-16 text-center max-w-2xl mx-auto mt-10 border-white/5 animate-slide-up">
                    <div class="w-20 h-20 bg-white/5 rounded-full flex items-center justify-center mx-auto mb-6 border border-white/10">
                        <i class="fas fa-folder-open text-4xl text-slate-600"></i>
                    </div>
                    <h3 class="text-2xl font-bold text-white mb-2">Empty Directory</h3>
                    <p class="text-slate-400 font-medium">No study materials have been published in this section yet.</p>
                </div>
            `;
        }

        // --- Global Events ---
        elements.searchInput.addEventListener('input', (e) => app.handleSearch(e.target.value));
        document.addEventListener('click', (e) => {
            if (!elements.searchInput.contains(e.target) && !elements.searchResults.contains(e.target)) {
                elements.searchResults.classList.add('hidden');
            }
        });
        elements.searchInput.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') { elements.searchResults.classList.add('hidden'); elements.searchInput.blur(); }
        });

        window.addEventListener('DOMContentLoaded', initApp);
    </script>
</body>
</html>
