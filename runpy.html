<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#080c16"
    >

    <meta
        name="description"
        content="Python Live Compiler"
    >

    <title>Python Live Compiler</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #080c16;
            font-family: Arial, sans-serif;
        }

        .loader {
            width: 100%;
            height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 18px;
            color: #ffffff;
        }

        .python-icon {
            width: 70px;
            height: 70px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 38px;
            background: linear-gradient(
                135deg,
                #3776ab,
                #ffd43b
            );
            box-shadow:
                0 15px 45px rgba(55, 118, 171, 0.35);
            animation: pulse 1.5s infinite ease-in-out;
        }

        .title {
            font-size: 22px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .status {
            font-size: 13px;
            color: #94a3b8;
        }

        .loader-bar {
            width: 180px;
            height: 4px;
            border-radius: 10px;
            overflow: hidden;
            background: #1e293b;
        }

        .loader-progress {
            width: 40%;
            height: 100%;
            border-radius: inherit;
            background: linear-gradient(
                90deg,
                #3776ab,
                #ffd43b
            );
            animation: loading 1.2s infinite ease-in-out;
        }

        @keyframes pulse {
            0%,
            100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.08);
            }
        }

        @keyframes loading {
            0% {
                transform: translateX(-100%);
            }

            100% {
                transform: translateX(450%);
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .python-icon,
            .loader-progress {
                animation: none;
            }
        }
    </style>
</head>

<body>

    <main class="loader">
        <div class="python-icon">
            🐍
        </div>

        <div class="title">
            Python Live Compiler
        </div>

        <div class="status" id="status">
            Detecting device...
        </div>

        <div class="loader-bar">
            <div class="loader-progress"></div>
        </div>
    </main>

    <script>
        /*
         * Detect whether the current device is primarily a mobile device.
         */
        function isMobileDevice() {
            const userAgent =
                navigator.userAgent ||
                navigator.vendor ||
                window.opera ||
                "";

            const mobileUserAgent =
                /android|iphone|ipad|ipod|windows phone|mobile/i.test(
                    userAgent
                );

            const touchDevice =
                navigator.maxTouchPoints > 0;

            const smallScreen =
                Math.min(
                    window.screen.width,
                    window.screen.height
                ) <= 768;

            return (
                mobileUserAgent ||
                (touchDevice && smallScreen)
            );
        }

        /*
         * Redirect the user to the appropriate compiler.
         */
        function openCompiler() {
            const status =
                document.getElementById("status");

            if (isMobileDevice()) {
                status.textContent =
                    "Opening Mobile Compiler...";

                window.location.replace(
                    "mobrunpy.html"
                );
            } else {
                status.textContent =
                    "Opening Desktop Compiler...";

                window.location.replace(
                    "otherrunpy.html"
                );
            }
        }

        /*
         * Start detection after the page is ready.
         */
        if (document.readyState === "loading") {
            document.addEventListener(
                "DOMContentLoaded",
                openCompiler,
                { once: true }
            );
        } else {
            openCompiler();
        }
    </script>

</body>
</html>
